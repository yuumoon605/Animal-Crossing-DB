<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あつ森 図鑑データベース</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="mb-4 text-center">あつまれどうぶつの森 データベース</h1>
        
        <!-- 検索・絞り込みフォーム -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form method="GET" action="/" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">名前検索</label>
                        <input type="text" name="q" class="form-control" value="{{ search_query }}" placeholder="例: スズキ">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">カテゴリ</label>
                        <select name="category" class="form-select">
                            <option value="">すべて</option>
                            <option value="魚" {% if category_filter == '魚' %}selected{% endif %}>魚</option>
                            <option value="虫" {% if category_filter == '虫' %}selected{% endif %}>虫</option>
                            <option value="海の幸" {% if category_filter == '海の幸' %}selected{% endif %}>海の幸</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">最低価格 (ベル)</label>
                        <input type="number" name="min_price" class="form-control" value="{{ min_price }}" placeholder="例: 1000">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">出現時期 (月など)</label>
                        <input type="text" name="season" class="form-control" value="{{ season_filter }}" placeholder="例: 11月">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">検索 / 絞り込み</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- データ一覧テーブル -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>名前</th>
                            <th>カテゴリ</th>
                            <th>価格 (ベル)</th>
                            <th>出現時期</th>
                            <th>出現時間</th>
                            <th>特殊条件</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if creatures %}
                            {% for item in creatures %}
                            <tr>
                                <strong><td>{{ item.name }}</td></strong>
                                <td><span class="badge bg-secondary">{{ item.category }}</span></td>
                                <td>{{ item.price | int }} ベル</td>
                                <td>{{ item.season }}</td>
                                <td>{{ item.time }}</td>
                                <td>{{ item.place }}</td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">該当する生き物が見つかりませんでした。</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
